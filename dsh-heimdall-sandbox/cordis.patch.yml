# The shipped provider row cannot be re-pointed: in loader patches, `name` is
# a match guard, not an override (dsh-app-boot applyEntryPatches skips the
# patch on mismatch). Instead: disable the base provider row and insert this
# package as a new row providing the same `sandbox` service.
#
# The deny corpus is NOT embedded here. It is owned by the generated
# `~/.config/heimdall/default.jsonc` (regenerated by dsh-heimdall's loader on
# every load) with user overrides in `~/.config/heimdall/config.json(c)` and
# per-repo `<workspaceRoot>/.config/heimdall.json(c)` — the same universal
# chain every heimdall harness reads.
- id: sandbox
  disabled: true

- insert:
    - id: sandbox-heimdall
      name: dsh-heimdall-sandbox
      config:
        binaryPath: ""
