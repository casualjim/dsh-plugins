# Re-points the base bundle's `id: sandbox` row from @deepseek-ai/dsh-sandbox-local
# to this package, delegating confinement to the heimdall-sandbox binary.
# The profile's cordis.patch.yml no longer needs a sandbox entry.
- id: sandbox
  name: dsh-heimdall-sandbox
  config:
    binaryPath: ""
    extraWritableRoots:
      - ~/github
      - ~/wagyu
      - ~/.npm
      - ~/.pi
      - ~/.lbdb
      - ~/.local/state/mise
      - ~/.local/share/mise
      - ~/.cache/codebase-memory-mcp
      - ~/.cache/gh
      - ~/Library/Caches/Mozilla.sccache
      - ~/Library/Caches/mise
      - ~/Library/Caches/hk
      - "~/Library/Application Support/crumbs"
      - ~/.cache/lindera
      - ~/.cache/syntastica-parsers
      - ~/.cache/huggingface
      - ~/.local/state/hk
      - ~/.cargo/registry
      - ~/Library/pnpm
    deniedPaths:
      # default-private-paths corpus (pi-heimdall useDefaultFilesystemDeny)
      - ~/Private
      - ~/.ssh
      - ~/.config
      - ~/.aws
      - ~/.azure
      - ~/.gcloud
      - ~/.oci
      - ~/.kube
      - ~/.docker
      - ~/.gnupg
      - ~/.sops
      - ~/.age
      - ~/.password-store
      - ~/.terraform.d
      - ~/.vault-token
      - ~/.netrc
      - ~/.npmrc
      - ~/.pypirc
      - ~/.cargo/credentials
      - "~/.cargo/credentials.toml"
      # AI coding tools (API keys commonly stored here)
      - ~/.claude
      - ~/.codex
      - ~/.forge
      - ~/.cursor
      - ~/.windsurf
      - ~/.antigravity
      - ~/.kiro
      - ~/.augment
      - ~/.zed
      - ~/.aider
      - ~/.gemini
      - ~/.continue
      - ~/.codeium
      - ~/.openai
      - ~/.anthropic
      # Editor / IDE configs (stored auth tokens)
      - ~/.vscode
      - ~/.vscode-server
      - ~/.code
      - "~/.config/JetBrains"
      - "~/.local/share/JetBrains"
      - ~/.config/nvim
      - "~/.local/share/nvim"
      - ~/.vim
      - ~/.viminfo
      # negation exceptions (heimdall.json deny array)
      - "!~/.config/mise"
      - "!~/.config/tin"
      - "!~/.config/tea"
      - "!~/.config/gh"
      - "!~/.npmrc"